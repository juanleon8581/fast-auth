services:
  api: &api_base
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: fast-auth-api
    environment:
      NODE_ENV: ${NODE_ENV:?missing NODE_ENV}
      PORT: ${PORT:-3000}
      SUPABASE_URL: ${SUPABASE_URL:?missing SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?missing SUPABASE_ANON_KEY}
      DATABASE_URL: ${DATABASE_URL:?missing DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:?missing JWT_SECRET}
      PASSPHRASE: ${PASSPHRASE:?missing PASSPHRASE}
      CRYPTO_ENVIRONMENT: ${CRYPTO_ENVIRONMENT:-prod}
      CRYPTO_FORCE_ENCRYPT: ${CRYPTO_FORCE_ENCRYPT:-false}
      CRYPTO_DISABLED_ENCRYPT: ${CRYPTO_DISABLED_ENCRYPT:-false}
      LOG_TRANSPORT: ${LOG_TRANSPORT:-console}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - 3000:3000
    volumes:
      - ./.keys:/app/.keys
      - ./.env.prod:/app/.env.prod
    networks:
      - prod-net
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "require(''http'').get(''http://localhost:3000/health'', res => process.exit(res.statusCode === 200 ? 0 : 1)).on(''error'', () => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    profiles: ["prod"]

  api-pr-preview:
    <<: *api_base
    ports:
      - "${PORT:-3001}:3000"
    networks:
      - preview-net
    container_name: fast-auth-api-pr-preview
    profiles: ["preview"]

networks:
  prod-net:
  preview-net:

components:
  schemas:
    UpdateUserPasswordRequest:
      type: object
      required:
        - sessionToken
        - refreshToken
        - newPassword
        - newPasswordConfirmation
      properties:
        sessionToken:
          type: string
          description: Valid JWT session token for authenticated user
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.session-payload.signature"
          format: jwt
          minLength: 32
        refreshToken:
          type: string
          description: Valid refresh token to renew the session
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.refresh-payload.signature"
          format: jwt
          minLength: 64
        newPassword:
          type: string
          description: New user password (minimum 8 characters, must contain uppercase, lowercase, numbers and symbols)
          example: "NewSecurePass123!"
          format: password
          minLength: 8
          maxLength: 128
          pattern: "^(?=.*[a-z])(?=.*[A-Z])(?=.*\\d)(?=.*[@$!%*?&])[A-Za-z\\d@$!%*?&]"
        newPasswordConfirmation:
          type: string
          description: Confirmation of the new password (must match newPassword)
          example: "NewSecurePass123!"
          format: password
          minLength: 8
          maxLength: 128
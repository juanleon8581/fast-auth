components:
  schemas:
    RequestResetPasswordEmailResponse:
      type: object
      properties:
        status:
          type: string
          description: Response status
          example: "success"
          enum: ["success"]
        data:
          type: object
          properties:
            message:
              type: string
              description: Success message confirming email was sent
              example: "Reset password email sent successfully"
          required:
            - message
        meta:
          type: object
          properties:
            requestId:
              type: string
              description: Unique request identifier
              example: "6e3f7063-79dc-43af-b014-252789805610"
            timestamp:
              type: string
              format: date-time
              description: Response timestamp in ISO format
              example: "2025-09-28T19:58:09.547Z"
            version:
              type: string
              description: API version
              example: "1.0.0"
          required:
            - requestId
            - timestamp
            - version
      required:
        - status
        - data
        - meta
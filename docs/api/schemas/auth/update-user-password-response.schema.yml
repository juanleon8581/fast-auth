components:
  schemas:
    UpdateUserPasswordResponse:
      type: object
      properties:
        status:
          type: string
          example: "success"
          description: Status of the response
        data:
          type: object
          properties:
            id:
              type: string
              description: User unique identifier
              example: "21efcacd-250e-4305-80fd-53f050a051df"
            email:
              type: string
              description: User email address
              example: "testuser@example.com"
              format: email
            name:
              type: string
              description: User display name
              example: "Test User"
            email_verified:
              type: boolean
              description: Whether the user's email is verified
              example: true
            phone:
              type: string
              description: User phone number
              example: "+1234567890"
        meta:
          type: object
          description: Additional metadata about the request
          properties:
            requestId:
              type: string
              description: Unique identifier for the request
              example: "ae5744b0-6f26-4d8f-bdf5-a6a473375ab6"
            timestamp:
              type: string
              format: date-time
              description: Timestamp when the response was generated
              example: "2025-09-26T01:13:27.346Z"
            version:
              type: string
              description: API version
              example: "1.0.0"
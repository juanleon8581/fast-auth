components:
  schemas:
    RegisterUserRequest:
      type: object
      required:
        - name
        - lastname
        - email
        - password
      properties:
        name:
          type: string
          description: User name
          minLength: 2
          maxLength: 50
          example: Joe

        lastname:
          type: string
          description: User lastname
          minLength: 2
          maxLength: 50
          example: Doe

        email:
          type: string
          description: User email
          maxLength: 100
          example: joe.doe@example.com
          format: email

        password:
          type: string
          description: User password (min 8 max 128, must have number, lower and uppercase )
          minLength: 8
          maxLength: 128
          example: 12345678
          format: password

        phone:
          type: string
          description: User phone (optional, international format)
          minLength: 10
          maxLength: 15
          example: "+1234567890"

        role:
          type: string
          description: User role (optional, defaults to USER)
          enum:
            - USER
            - MODERATOR
            - ADMIN
          default: USER
          example: USER

        metadata:
          type: object
          description: Additional profile metadata (string values only)
          additionalProperties:
            type: string
          example:
            display_name: "John Doe"
            theme: "dark"

components:
  schemas:
    RequestResetPasswordEmailRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          description: User email address to send reset password link
          example: user@example.com
          format: email
          maxLength: 100
        redirectTo:
          type: string
          description: URL where user will be redirected after clicking reset link
          example: "https://myapp.com/reset-password"
          format: uri
          maxLength: 2048
paths:
  /api/auth/update-user-password:
    put:
      tags:
        - Auth
      summary: Update user password
      description: Updates the password for an authenticated user. Requires valid session and refresh tokens along with the new password and its confirmation.
      operationId: updateUserPassword
      requestBody:
        required: true
        description: User password update data including authentication tokens and new password
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserPasswordRequest"
      responses:
        "200":
          description: Password updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateUserPasswordResponse"
        "400":
          description: Bad Request - Invalid request data or malformed input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestError"
        "401":
          description: Unauthorized - Invalid or expired session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedError"
        "422":
          description: Validation Error - Required fields missing or invalid format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "500":
          description: Internal Server Error - Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerError"

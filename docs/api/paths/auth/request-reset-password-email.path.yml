paths:
  /api/auth/request-reset-password-email:
    post:
      tags:
        - Auth
      summary: Request password reset email
      description: Send a password reset email to the user with a reset link. The email will contain a link to reset the password, optionally redirecting to a specified URL after reset.
      operationId: requestResetPasswordEmail
      requestBody:
        description: Email and optional redirect URL for password reset
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestResetPasswordEmailRequest"
            examples:
              with_redirect:
                summary: Request with redirect URL
                value:
                  email: "user@example.com"
                  redirectTo: "https://myapp.com/reset-password"
              without_redirect:
                summary: Request without redirect URL
                value:
                  email: "user@example.com"
        required: true
      responses:
        "200":
          description: Reset password email sent successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestResetPasswordEmailResponse"
              examples:
                success:
                  summary: Successful response
                  value:
                    status: "success"
                    data:
                      message: "Reset password email sent successfully"
                    meta:
                      requestId: "6e3f7063-79dc-43af-b014-252789805610"
                      timestamp: "2025-09-28T19:58:09.547Z"
                      version: "1.0.0"
        "400":
          description: Bad Request - Email could not be sent due to service issues
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestError"
        "422":
          description: Validation Error - Invalid email format or redirect URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
              examples:
                invalid_email:
                  summary: Invalid email format
                  value:
                    status: "error"
                    code: 422
                    errors:
                      - message: "Must be a valid email"
                        field: "email"
                        code: "VALIDATION_ERROR"
                    meta:
                      requestId: "a99cd06a-4670-4fc8-8fb2-c2801f05d8c1"
                      timestamp: "2025-09-28T19:58:32.396Z"
                      version: "1.0.0"
                invalid_redirect_url:
                  summary: Invalid redirect URL
                  value:
                    status: "error"
                    code: 422
                    errors:
                      - message: "Redirect URL must be a valid URL"
                        field: "redirectTo"
                        code: "VALIDATION_ERROR"
                    meta:
                      requestId: "b81b4ad9-1271-4008-b5c1-deda721ca544"
                      timestamp: "2025-09-28T19:58:44.371Z"
                      version: "1.0.0"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerError"